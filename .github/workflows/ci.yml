name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -cover ./...

  # learn needs a raw socket, so this runs for real on the ubuntu runner:
  # capture for a few seconds, make two connections, check what got written.
  learn-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build -o egresswall ./cmd/egresswall
      - name: learn while curling
        run: |
          sudo ./egresswall learn -duration 10s -out learned.yaml &
          sleep 3
          curl -sS --connect-timeout 10 -o /dev/null https://example.com
          curl -sS --connect-timeout 10 -o /dev/null http://example.com
          wait
          cat learned.yaml
      - name: the policy says what happened
        run: |
          ./egresswall validate -policy learned.yaml
          ./egresswall check -policy learned.yaml example.com:443
          ./egresswall check -policy learned.yaml example.com:80
          if ./egresswall check -policy learned.yaml example.com:22; then echo "port 22 was never used"; exit 1; fi
          if ./egresswall check -policy learned.yaml evil.example:443; then echo "unknown host must be denied"; exit 1; fi

  # enforce for real: load a policy that allows example.com and the runner's
  # own endpoints, see one request pass and two get refused, then stop and
  # confirm the table is gone.
  enforce-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build -o egresswall ./cmd/egresswall
      - name: policy for this runner
        run: |
          cat > policy.yaml <<'EOF2'
          version: 1
          default: deny
          allow:
            - name: dns
              ports: ["53"]
              proto: udp
            - name: example-only-from-ewtest
              domains: ["example.com"]
              ports: ["443"]
              cgroup: ewtest
            - name: runner
              domains: ["*.github.com", "github.com", "*.githubusercontent.com", "*.blob.core.windows.net"]
              ports: ["443"]
          EOF2
          ./egresswall enforce -policy policy.yaml -print
      - name: pull the container image before the wall goes up
        run: docker pull -q curlimages/curl:latest
      - name: a webhook receiver on loopback
        run: |
          cat > hook.py <<'EOF2'
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  self.send_response(200); self.end_headers()
                  open('hook.out', 'a').write(body.decode() + "\n")
              def log_message(self, *a): pass
          http.server.HTTPServer(('127.0.0.1', 9099), H).serve_forever()
          EOF2
          python3 hook.py &
          sleep 1
      - name: enforce while curling
        run: |
          sudo rmdir /sys/fs/cgroup/ewtest 2>/dev/null || true
          sudo ./egresswall enforce -policy policy.yaml -forward -verbose -alert-webhook http://127.0.0.1:9099/ 2>enforce.log &
          EW=$!
          sleep 3
          sudo nft list ruleset
          grep -q "cgroup ewtest does not exist yet" enforce.log || (echo "missing cgroup should have been reported"; exit 1)
          curl -sS --connect-timeout 10 -o /dev/null -w "github.com: %{http_code}\n" https://github.com
          if curl -sS --connect-timeout 5 -o /dev/null https://example.com; then echo "example.com is only for cgroup ewtest, which does not exist yet"; exit 1; fi
          if curl -sS --connect-timeout 5 -o /dev/null http://github.com; then echo "github.com:80 should have been refused"; exit 1; fi
          if curl -sS --connect-timeout 5 -o /dev/null https://1.1.1.1; then echo "raw ip should have been refused"; exit 1; fi
          echo "--- the cgroup appears, the table must reload within a few seconds ---"
          sudo mkdir /sys/fs/cgroup/ewtest
          sleep 8
          grep -q "table reloaded" enforce.log || (echo "reload did not happen"; cat enforce.log; exit 1)
          sudo nft list chain inet egresswall output | grep cgroupv2
          sudo sh -c 'echo $$ > /sys/fs/cgroup/ewtest/cgroup.procs; curl -sS --connect-timeout 10 -o /dev/null -w "example.com from ewtest: %{http_code}\n" https://example.com'
          if curl -sS --connect-timeout 5 -o /dev/null https://example.com; then echo "example.com from outside ewtest should still be refused"; exit 1; fi
          echo "--- from a container, through the forward chain ---"
          docker run --rm curlimages/curl:latest -sS --connect-timeout 10 -o /dev/null -w "container -> github.com: %{http_code}\n" https://github.com
          if docker run --rm curlimages/curl:latest -sS --connect-timeout 5 -o /dev/null http://github.com; then echo "container -> github.com:80 should have been refused"; exit 1; fi
          sleep 1
          sudo kill -INT $EW
          wait $EW || true
          echo "--- daemon log ---"; cat enforce.log
          grep -q "refused .*github.com):80" enforce.log || (echo "refusal was not reported with its name"; exit 1)
      - name: the webhook got the refusals
        run: |
          cat hook.out
          python3 - <<'EOF2'
          import json
          seen = [json.loads(l) for l in open('hook.out') if l.strip()]
          assert seen, "no webhook payload arrived"
          refused = [r for p in seen for r in p["refused"]]
          assert any(r.get("host", "").endswith("github.com") and r["port"] == 80 for r in refused), refused
          assert any(r["ip"] == "1.1.1.1" for r in refused), refused
          assert all(p["source"] == "egresswall" and p["host"] for p in seen)
          print(f"{len(seen)} payload(s), {len(refused)} destination(s)")
          EOF2
          if sudo nft list tables | grep -q egresswall; then echo "table left behind"; exit 1; fi
          sudo rmdir /sys/fs/cgroup/ewtest || true
